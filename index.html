<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公司桌面資訊儀表板</title>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: rgba(28, 37, 65, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-warn: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 10px;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr 1.1fr; /* 右邊匯率略寬以容納多種貨幣 */
            gap: 10px;
            width: 100%;
            height: 100%;
            max-width: 1000px;
            max-height: 600px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 左側：時間、農曆/節氣 */
        .time-card {
            flex: 1.3;
            text-align: center;
            background: linear-gradient(135deg, rgba(28, 37, 65, 0.9), rgba(11, 19, 43, 0.9));
        }

        #clock {
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 1.1;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        #date {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 3px;
        }

        #lunar-info {
            font-size: 0.85rem;
            color: #60a5fa;
            font-weight: 600;
            margin-top: 2px;
        }

        #countdown {
            margin-top: 5px;
            font-size: 0.75rem;
            color: var(--accent-warn);
            background: rgba(245, 158, 11, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
            display: inline-block;
        }

        /* 天氣卡片 */
        .weather-card {
            flex: 1.1;
        }

        .weather-alert {
            display: inline-block;
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-top: 3px;
            font-weight: bold;
        }

        /* 恆指卡片 */
        .hsi-card {
            flex: 1;
        }

        .hsi-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 10px;
            border-radius: 8px;
            margin-top: 4px;
        }

        #hsi-price {
            font-size: 1.35rem;
            font-weight: bold;
        }

        #hsi-change {
            font-size: 0.9rem;
            font-weight: bold;
        }

        .update-time {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-align: right;
            margin-top: 2px;
        }

        /* 匯率卡片（優化排版：多貨幣網格） */
        .fx-card {
            flex: 2;
            justify-content: space-between;
        }

        .fx-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
            margin-top: 6px;
        }

        .fx-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 4px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .fx-item:active, .fx-item.active {
            background: rgba(59, 130, 246, 0.25);
            border-color: var(--accent-blue);
        }

        .fx-name {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .fx-rate {
            font-size: 0.85rem;
            font-weight: bold;
            color: #ffffff;
        }

        .fx-converter {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            padding: 6px 10px;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .fx-converter input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.85rem;
            width: 70px;
            text-align: right;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }

        .swap-btn {
            background: var(--accent-blue);
            border: none;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- 左欄：時間、農曆/節氣、天氣 -->
        <div class="column">
            <div class="card time-card">
                <div id="clock">00:00:00</div>
                <div id="date">加載中...</div>
                <div id="lunar-info">農曆計算中...</div>
                <div><span id="countdown">假期倒數：計算中...</span></div>
            </div>

            <div class="card weather-card">
                <div class="card-title">香港即時天氣</div>
                <div id="weather-info" style="font-size: 1.1rem; margin-top: 4px; line-height: 1.3;">載入天氣數據中...</div>
                <div id="weather-alerts"></div>
            </div>
        </div>

        <!-- 右欄：恆指、即時匯率一覽與換算器 -->
        <div class="column">
            <div class="card hsi-card">
                <div class="card-title">香港恆生指數 (HSI)</div>
                <div class="hsi-body">
                    <div id="hsi-price">載入中...</div>
                    <div id="hsi-change">--</div>
                </div>
                <div id="hsi-update-time" class="update-time">更新時間: --</div>
            </div>

            <div class="card fx-card">
                <div class="card-title">
                    <span>即時外幣牌價 (兌 HKD)</span>
                    <span id="fx-update-time" style="font-size: 0.7rem; font-weight: normal;">更新中...</span>
                </div>

                <!-- 7 種主要外幣牌價一覽表 -->
                <div class="fx-grid">
                    <div class="fx-item active" id="item-USD" onclick="selectCurrency('USD')">
                        <span class="fx-name">USD 美元</span>
                        <span class="fx-rate" id="rate-USD">--</span>
                    </div>
                    <div class="fx-item" id="item-EUR" onclick="selectCurrency('EUR')">
                        <span class="fx-name">EUR 歐元</span>
                        <span class="fx-rate" id="rate-EUR">--</span>
                    </div>
                    <div class="fx-item" id="item-GBP" onclick="selectCurrency('GBP')">
                        <span class="fx-name">GBP 英鎊</span>
                        <span class="fx-rate" id="rate-GBP">--</span>
                    </div>
                    <div class="fx-item" id="item-CHF" onclick="selectCurrency('CHF')">
                        <span class="fx-name">CHF 瑞郎</span>
                        <span class="fx-rate" id="rate-CHF">--</span>
                    </div>
                    <div class="fx-item" id="item-JPY" onclick="selectCurrency('JPY')">
                        <span class="fx-name">JPY 日圓</span>
                        <span class="fx-rate" id="rate-JPY">--</span>
                    </div>
                    <div class="fx-item" id="item-AUD" onclick="selectCurrency('AUD')">
                        <span class="fx-name">AUD 澳元</span>
                        <span class="fx-rate" id="rate-AUD">--</span>
                    </div>
                    <div class="fx-item" id="item-KRW" onclick="selectCurrency('KRW')" style="grid-column: span 2;">
                        <span class="fx-name">KRW 韓圓 (WON)</span>
                        <span class="fx-rate" id="rate-KRW">--</span>
                    </div>
                </div>

                <!-- 底部點擊動態換算器 -->
                <div class="fx-converter">
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <span id="fx-dir-label" style="font-size: 0.75rem; color: #60a5fa; font-weight: bold;">USD ➜ HKD</span>
                        <button class="swap-btn" onclick="toggleDirection()">⇄</button>
                    </div>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <input type="number" id="fx-amount" value="100" oninput="calculateFX()">
                        <span id="fx-result" style="font-size: 0.95rem; font-weight: bold; color: #10b981;">--</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 支持的 7 種貨幣
        let fxRates = { USD: 0, EUR: 0, GBP: 0, CHF: 0, JPY: 0, AUD: 0, KRW: 0 };
        let selectedCurr = 'USD';
        let isForeignToHkd = true; // true: 外幣轉HKD, false: HKD轉外幣

        // 1. 時鐘與西曆日期
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('zh-HK', { hour12: false });
            
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('date').textContent = now.toLocaleDateString('zh-HK', options);
        }

        // 2. 農曆與節氣轉換計算
        function updateLunarDate() {
            try {
                const now = new Date();
                const lunarText = new Intl.DateTimeFormat('zh-TN-u-ca-chinese', {
                    day: 'numeric',
                    month: 'long'
                }).format(now);

                const month = now.getMonth() + 1;
                const day = now.getDate();
                let solarTerm = "";

                const terms = {
                    1: { 5: "小寒", 20: "大寒" }, 2: { 4: "立春", 19: "雨水" },
                    3: { 5: "驚蟄", 20: "春分" }, 4: { 4: "清明", 19: "穀雨" },
                    5: { 5: "立夏", 20: "小滿" }, 6: { 5: "芒種", 21: "夏至" },
                    7: { 7: "小暑", 22: "大暑" }, 8: { 7: "立秋", 23: "處暑" },
                    9: { 7: "白露", 22: "秋分" }, 10: { 8: "寒露", 23: "霜降" },
                    11: { 7: "立冬", 22: "小雪" }, 12: { 7: "大雪", 21: "冬至" }
                };

                if (terms[month]) {
                    for (let d in terms[month]) {
                        if (Math.abs(day - parseInt(d)) <= 1) {
                            solarTerm = ` · 【${terms[month][d]}】`;
                            break;
                        }
                    }
                }

                document.getElementById('lunar-info').textContent = `農曆 ${lunarText}${solarTerm}`;
            } catch (e) {
                document.getElementById('lunar-info').textContent = '';
            }
        }

        // 3. 香港公眾假期倒數
        function updateHolidayCountdown() {
            const now = new Date();
            const year = now.getFullYear();

            const holidays = [
                { name: "中秋節後翌日", date: new Date(year, 8, 26) },
                { name: "國慶日", date: new Date(year, 9, 1) },
                { name: "重陽節", date: new Date(year, 9, 19) },
                { name: "聖誕節", date: new Date(year, 11, 25) },
                { name: "元旦", date: new Date(year + 1, 0, 1) }
            ];

            let nextHoliday = holidays.find(h => h.date >= now);
            if (!nextHoliday) nextHoliday = { name: "元旦", date: new Date(year + 1, 0, 1) };

            const diffTime = nextHoliday.date - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            document.getElementById('countdown').textContent = `距離 ${nextHoliday.name}：仲有 ${diffDays} 天`;
        }

        // 4. 天文台天氣
        async function fetchWeather() {
            const weatherEl = document.getElementById('weather-info');
            const alertsEl = document.getElementById('weather-alerts');

            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();
                
                const temp = data.temperature.data[0].value;
                const humidity = data.humidity.data[0].value;
                const rainfall = data.rainfall.data[0]?.max || 0;

                weatherEl.innerHTML = `🌡️ <b>${temp}°C</b> &nbsp;|&nbsp; 💧 <b>${humidity}%</b><br><span style="font-size:0.8rem; color:#94a3b8;">🌧️ 今日降雨量: ${rainfall} mm</span>`;

                const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const warnData = await warnRes.json();
                
                let alertHtml = '';
                if (warnData && Object.keys(warnData).length > 0) {
                    for (const key in warnData) {
                        const warn = warnData[key];
                        if (warn.name) alertHtml += `<span class="weather-alert">⚠️ ${warn.name}</span> `;
                    }
                }
                alertsEl.innerHTML = alertHtml || '<span style="font-size:0.75rem; color:#10b981; margin-top:2px; display:block;">現時無特別天氣警告</span>';

            } catch (err) {
                weatherEl.textContent = '天氣數據讀取失敗';
            }
        }

        // 5. 恆生指數
        async function fetchHSI() {
            const priceEl = document.getElementById('hsi-price');
            const changeEl = document.getElementById('hsi-change');
            const timeEl = document.getElementById('hsi-update-time');

            try {
                const res = await fetch('https://push2.eastmoney.com/api/qt/stock/get?secid=100.HSI&fields=f43,f169,f170');
                const responseData = await res.json();
                const data = responseData.data;

                if (!data) throw new Error('無數據');
                
                const currentPrice = data.f43 / 100;
                const change = data.f169 / 100;
                const changePercent = data.f170 / 100;
                
                const isPositive = change >= 0;
                const sign = isPositive ? '+' : '';
                const color = isPositive ? 'var(--accent-green)' : 'var(--accent-red)';

                priceEl.textContent = currentPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                priceEl.style.color = '#ffffff';

                changeEl.textContent = `${sign}${change.toFixed(2)} (${sign}${changePercent.toFixed(2)}%)`;
                changeEl.style.color = color;

                const now = new Date();
                timeEl.textContent = `更新時間: ${now.toLocaleTimeString('zh-HK', { hour12: false })}`;
            } catch (err) {
                priceEl.textContent = '數據擷取中...';
            }
        }

        // 6. 即時外幣匯率數據抓取
        async function fetchFX() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/HKD');
                const data = await res.json();

                if (data && data.rates) {
                    for (let key in fxRates) {
                        if (data.rates[key]) {
                            fxRates[key] = 1 / data.rates[key];
                            const rateEl = document.getElementById(`rate-${key}`);
                            if (rateEl) {
                                // JPY 與 KRW 顯示位數調整，其餘保留 4 位小數
                                const decimals = (key === 'JPY' || key === 'KRW') ? 4 : 3;
                                rateEl.textContent = fxRates[key].toFixed(decimals);
                            }
                        }
                    }

                    const now = new Date();
                    document.getElementById('fx-update-time').textContent = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')} 更新`;
                    
                    calculateFX();
                }
            } catch (err) {
                console.error('匯率數據讀取失敗:', err);
            }
        }

        // 選擇換算貨幣
        function selectCurrency(curr) {
            selectedCurr = curr;
            document.querySelectorAll('.fx-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`item-${curr}`).classList.add('active');
            calculateFX();
        }

        // 切換換算方向
        function toggleDirection() {
            isForeignToHkd = !isForeignToHkd;
            calculateFX();
        }

        // 計算換算結果
        function calculateFX() {
            const amount = parseFloat(document.getElementById('fx-amount').value) || 0;
            const rate = fxRates[selectedCurr];

            const dirLabel = document.getElementById('fx-dir-label');
            const resultEl = document.getElementById('fx-result');

            if (!rate) {
                resultEl.textContent = "載入中...";
                return;
            }

            if (isForeignToHkd) {
                dirLabel.textContent = `${selectedCurr} ➜ HKD`;
                const totalHKD = amount * rate;
                resultEl.textContent = `$${totalHKD.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} HKD`;
            } else {
                dirLabel.textContent = `HKD ➜ ${selectedCurr}`;
                const totalForeign = amount / rate;
                resultEl.textContent = `${totalForeign.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} ${selectedCurr}`;
            }
        }

        // 初始化與定時更新
        updateTime();
        updateLunarDate();
        updateHolidayCountdown();
        fetchWeather();
        fetchHSI();
        fetchFX();

        setInterval(updateTime, 1000);
        setInterval(fetchWeather, 600000); // 10分鐘更新天氣
        setInterval(fetchHSI, 60000);      // 1分鐘更新恆指
        setInterval(fetchFX, 1800000);     // 30分鐘更新匯率
    </script>
</body>
</html>
