<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公司桌面資訊儀表板</title>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: rgba(28, 37, 65, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-warn: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 12px;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            height: 100%;
            max-width: 1000px;
            max-height: 600px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 左側：時間、農曆/節氣 */
        .time-card {
            flex: 1.4;
            text-align: center;
            background: linear-gradient(135deg, rgba(28, 37, 65, 0.9), rgba(11, 19, 43, 0.9));
        }

        #clock {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 1.1;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        #date {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        #lunar-info {
            font-size: 0.9rem;
            color: #60a5fa;
            font-weight: 600;
            margin-top: 2px;
        }

        #countdown {
            margin-top: 6px;
            font-size: 0.8rem;
            color: var(--accent-warn);
            background: rgba(245, 158, 11, 0.1);
            padding: 3px 8px;
            border-radius: 6px;
            display: inline-block;
        }

        /* 天氣卡片 */
        .weather-card {
            flex: 1.2;
        }

        .weather-alert {
            display: inline-block;
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-top: 4px;
            font-weight: bold;
        }

        /* 恆指卡片 */
        .hsi-card {
            flex: 1;
        }

        .hsi-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            padding: 8px 12px;
            border-radius: 10px;
            margin-top: 6px;
        }

        #hsi-price {
            font-size: 1.5rem;
            font-weight: bold;
        }

        #hsi-change {
            font-size: 0.95rem;
            font-weight: bold;
        }

        .update-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: right;
            margin-top: 4px;
        }

        /* 匯率與換算器卡片 */
        .fx-card {
            flex: 1.8;
            justify-content: flex-start;
        }

        .fx-select-group {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: 8px;
        }

        .fx-select-group select, .fx-select-group input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }

        .fx-select-group select {
            flex: 1;
        }

        .fx-select-group input {
            width: 80px;
            text-align: right;
        }

        .swap-btn {
            background: var(--accent-blue);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .fx-result-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- 左欄：時間、農曆/節氣、天氣 -->
        <div class="column">
            <div class="card time-card">
                <div id="clock">00:00:00</div>
                <div id="date">加載中...</div>
                <div id="lunar-info">農曆計算中...</div>
                <div><span id="countdown">假期倒數：計算中...</span></div>
            </div>

            <div class="card weather-card">
                <div class="card-title">香港即時天氣</div>
                <div id="weather-info" style="font-size: 1.15rem; margin-top: 6px; line-height: 1.4;">載入天氣數據中...</div>
                <div id="weather-alerts"></div>
            </div>
        </div>

        <!-- 右欄：恆指、即時匯率換算器 -->
        <div class="column">
            <div class="card hsi-card">
                <div class="card-title">香港恆生指數 (HSI)</div>
                <div class="hsi-body">
                    <div id="hsi-price">載入中...</div>
                    <div id="hsi-change">--</div>
                </div>
                <div id="hsi-update-time" class="update-time">更新時間: --</div>
            </div>

            <div class="card fx-card">
                <div class="card-title">
                    <span>即時外幣匯率 & 換算</span>
                    <span id="fx-update-time" style="font-size: 0.75rem; font-weight: normal;">更新中...</span>
                </div>

                <!-- 貨幣選擇與換算輸入 -->
                <div class="fx-select-group">
                    <select id="currency-select" onchange="calculateFX()">
                        <option value="CHF">CHF 瑞士法郎</option>
                        <option value="EUR">EUR 歐元</option>
                        <option value="JPY">JPY 日圓</option>
                        <option value="KRW">KRW 韓圓 (WON)</option>
                    </select>

                    <button class="swap-btn" onclick="toggleDirection()" title="切換換算方向">⇄</button>

                    <input type="number" id="fx-amount" value="100" oninput="calculateFX()">
                </div>

                <!-- 換算結果與當前牌價 -->
                <div class="fx-result-box">
                    <div>
                        <div id="fx-dir-label" style="font-size: 0.75rem; color: var(--text-secondary);">外幣 ➜ 港幣</div>
                        <div id="fx-result" style="font-size: 1.3rem; font-weight: bold; color: #10b981;">計算中...</div>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-size: 0.75rem; color: var(--text-secondary);">參考匯率</div>
                        <div id="fx-rate-display" style="font-size: 0.95rem; font-weight: bold; color: #60a5fa;">--</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局匯率儲存 (以 HKD 為基準)
        let fxRates = { CHF: 0, EUR: 0, JPY: 0, KRW: 0 };
        let isForeignToHkd = true; // true: 外幣轉HKD, false: HKD轉外幣

        // 1. 時鐘與西曆日期
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('zh-HK', { hour12: false });
            
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('date').textContent = now.toLocaleDateString('zh-HK', options);
        }

        // 2. 農曆與節氣轉換計算
        function updateLunarDate() {
            try {
                const now = new Date();
                const lunarText = new Intl.DateTimeFormat('zh-TN-u-ca-chinese', {
                    day: 'numeric',
                    month: 'long'
                }).format(now);

                const month = now.getMonth() + 1;
                const day = now.getDate();
                let solarTerm = "";

                const terms = {
                    1: { 5: "小寒", 20: "大寒" }, 2: { 4: "立春", 19: "雨水" },
                    3: { 5: "驚蟄", 20: "春分" }, 4: { 4: "清明", 19: "穀雨" },
                    5: { 5: "立夏", 20: "小滿" }, 6: { 5: "芒種", 21: "夏至" },
                    7: { 7: "小暑", 22: "大暑" }, 8: { 7: "立秋", 23: "處暑" },
                    9: { 7: "白露", 22: "秋分" }, 10: { 8: "寒露", 23: "霜降" },
                    11: { 7: "立冬", 22: "小雪" }, 12: { 7: "大雪", 21: "冬至" }
                };

                if (terms[month]) {
                    for (let d in terms[month]) {
                        if (Math.abs(day - parseInt(d)) <= 1) {
                            solarTerm = ` · 【${terms[month][d]}】`;
                            break;
                        }
                    }
                }

                document.getElementById('lunar-info').textContent = `農曆 ${lunarText}${solarTerm}`;
            } catch (e) {
                document.getElementById('lunar-info').textContent = '';
            }
        }

        // 3. 香港公眾假期倒數
        function updateHolidayCountdown() {
            const now = new Date();
            const year = now.getFullYear();

            const holidays = [
                { name: "中秋節後翌日", date: new Date(year, 8, 26) },
                { name: "國慶日", date: new Date(year, 9, 1) },
                { name: "重陽節", date: new Date(year, 9, 19) },
                { name: "聖誕節", date: new Date(year, 11, 25) },
                { name: "元旦", date: new Date(year + 1, 0, 1) }
            ];

            let nextHoliday = holidays.find(h => h.date >= now);
            if (!nextHoliday) nextHoliday = { name: "元旦", date: new Date(year + 1, 0, 1) };

            const diffTime = nextHoliday.date - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            document.getElementById('countdown').textContent = `距離 ${nextHoliday.name}：仲有 ${diffDays} 天`;
        }

        // 4. 天文台天氣
        async function fetchWeather() {
            const weatherEl = document.getElementById('weather-info');
            const alertsEl = document.getElementById('weather-alerts');

            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();
                
                const temp = data.temperature.data[0].value;
                const humidity = data.humidity.data[0].value;
                const rainfall = data.rainfall.data[0]?.max || 0;

                weatherEl.innerHTML = `🌡️ <b>${temp}°C</b> &nbsp;|&nbsp; 💧 <b>${humidity}%</b><br><span style="font-size:0.85rem; color:#94a3b8;">🌧️ 今日降雨量: ${rainfall} mm</span>`;

                const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const warnData = await warnRes.json();
                
                let alertHtml = '';
                if (warnData && Object.keys(warnData).length > 0) {
                    for (const key in warnData) {
                        const warn = warnData[key];
                        if (warn.name) alertHtml += `<span class="weather-alert">⚠️ ${warn.name}</span> `;
                    }
                }
                alertsEl.innerHTML = alertHtml || '<span style="font-size:0.75rem; color:#10b981; margin-top:4px; display:block;">現時無特別天氣警告</span>';

            } catch (err) {
                weatherEl.textContent = '天氣數據讀取失敗';
            }
        }

        // 5. 恆生指數
        async function fetchHSI() {
            const priceEl = document.getElementById('hsi-price');
            const changeEl = document.getElementById('hsi-change');
            const timeEl = document.getElementById('hsi-update-time');

            try {
                const res = await fetch('https://push2.eastmoney.com/api/qt/stock/get?secid=100.HSI&fields=f43,f169,f170');
                const responseData = await res.json();
                const data = responseData.data;

                if (!data) throw new Error('無數據');
                
                const currentPrice = data.f43 / 100;
                const change = data.f169 / 100;
                const changePercent = data.f170 / 100;
                
                const isPositive = change >= 0;
                const sign = isPositive ? '+' : '';
                const color = isPositive ? 'var(--accent-green)' : 'var(--accent-red)';

                priceEl.textContent = currentPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                priceEl.style.color = '#ffffff';

                changeEl.textContent = `${sign}${change.toFixed(2)} (${sign}${changePercent.toFixed(2)}%)`;
                changeEl.style.color = color;

                const now = new Date();
                timeEl.textContent = `更新時間: ${now.toLocaleTimeString('zh-HK', { hour12: false })}`;
            } catch (err) {
                priceEl.textContent = '數據擷取中...';
            }
        }

        // 6. 即時外幣匯率數據 (使用開放公開 API)
        async function fetchFX() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/HKD');
                const data = await res.json();

                if (data && data.rates) {
                    // 計算以 HKD 為基準的匯率 (1的外幣 = 多少 HKD)
                    fxRates.CHF = 1 / data.rates.CHF;
                    fxRates.EUR = 1 / data.rates.EUR;
                    fxRates.JPY = 1 / data.rates.JPY;
                    fxRates.KRW = 1 / data.rates.KRW;

                    const now = new Date();
                    document.getElementById('fx-update-time').textContent = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')} 更新`;
                    
                    calculateFX();
                }
            } catch (err) {
                console.error('匯率數據讀取失敗:', err);
            }
        }

        // 換算方向切換
        function toggleDirection() {
            isForeignToHkd = !isForeignToHkd;
            calculateFX();
        }

        // 執行匯率計算與畫面更新
        function calculateFX() {
            const curr = document.getElementById('currency-select').value;
            const amount = parseFloat(document.getElementById('fx-amount').value) || 0;
            const rate = fxRates[curr];

            const dirLabel = document.getElementById('fx-dir-label');
            const resultEl = document.getElementById('fx-result');
            const rateDisplay = document.getElementById('fx-rate-display');

            if (!rate) {
                resultEl.textContent = "載入中...";
                return;
            }

            rateDisplay.textContent = `1 ${curr} = ${rate.toFixed(4)} HKD`;

            if (isForeignToHkd) {
                dirLabel.textContent = `${curr} ➜ HKD`;
                const totalHKD = amount * rate;
                resultEl.textContent = `$${totalHKD.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} HKD`;
            } else {
                dirLabel.textContent = `HKD ➜ ${curr}`;
                const totalForeign = amount / rate;
                resultEl.textContent = `${totalForeign.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${curr}`;
            }
        }

        // 初始化與定時更新
        updateTime();
        updateLunarDate();
        updateHolidayCountdown();
        fetchWeather();
        fetchHSI();
        fetchFX();

        setInterval(updateTime, 1000);
        setInterval(fetchWeather, 600000); // 10分鐘更新天氣
        setInterval(fetchHSI, 60000);      // 1分鐘更新恆指
        setInterval(fetchFX, 1800000);     // 30分鐘更新匯率
    </script>
</body>
</html>
