<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公司桌面資訊儀表板 - 寶寶陪伴版</title>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: rgba(28, 37, 65, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-warn: #f59e0b;
            --accent-pink: #f472b6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 5px;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 8px;
            width: 100%;
            height: 100%;
            max-width: 1050px;
            max-height: 100vh;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 100%;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .time-card {
            flex: 1.1;
            text-align: center;
            background: linear-gradient(135deg, rgba(28, 37, 65, 0.9), rgba(11, 19, 43, 0.9));
        }

        #clock {
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 1.1;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        #date {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        #lunar-info {
            font-size: 0.85rem;
            color: #60a5fa;
            font-weight: 600;
            margin-top: 1px;
        }

        #countdown {
            margin-top: 4px;
            font-size: 0.8rem;
            color: var(--accent-warn);
            background: rgba(245, 158, 11, 0.15);
            padding: 2px 6px;
            border-radius: 6px;
            display: inline-block;
        }

        .weather-card {
            flex: 1;
        }

        .weather-alert {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-top: 4px;
            font-weight: 800;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        @keyframes alertPulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.04); opacity: 0.85; }
            100% { transform: scale(1); opacity: 1; }
        }

        .alert-yellow-rain {
            background: #facc15;
            color: #000000;
            border: 1px solid #fde047;
            animation: alertPulse 2s infinite ease-in-out;
        }

        .alert-red-rain {
            background: #ef4444;
            color: #ffffff;
            border: 1px solid #fca5a5;
            animation: alertPulse 1.2s infinite ease-in-out;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
        }

        .alert-black-rain {
            background: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            animation: alertPulse 1s infinite ease-in-out;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
        }

        .alert-typhoon {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: #ffffff;
            border: 1px solid #c084fc;
            animation: alertPulse 1.2s infinite ease-in-out;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.7);
        }

        .alert-default {
            background: rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.5);
        }

        .hsi-card { flex: 1; }

        .hsi-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 10px;
            border-radius: 8px;
            margin-top: 4px;
        }

        #hsi-price { font-size: 1.35rem; font-weight: bold; }
        #hsi-change { font-size: 0.9rem; font-weight: bold; }

        .work-cat-card {
            flex: 1.45;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.8));
            justify-content: space-between;
            padding: 8px 12px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            margin: 4px 0;
            position: relative;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #3b82f6, #10b981);
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.5s ease-in-out;
        }

        .cat-box {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 10px;
            border-radius: 10px;
            margin-top: 4px;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
            position: relative;
        }

        .cat-box:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }

        .cat-avatar-container {
            position: relative;
            width: 85px;
            height: 85px;
            flex-shrink: 0;
        }

        .bobo-photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: none;
            box-shadow: none;
            transition: transform 0.3s ease;
            background-color: rgba(255,255,255,0.1);
        }

        .cat-speech-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
        }

        .cat-name {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: bold;
            margin-bottom: 2px;
        }

        .cat-speech {
            font-size: 0.95rem;
            color: var(--accent-pink);
            font-weight: 600;
            line-height: 1.35;
        }

        .heart-pop {
            position: absolute;
            top: -2px;
            right: -2px;
            font-size: 1.3rem;
            opacity: 0;
            pointer-events: none;
        }

        .heart-pop.animate {
            animation: popUp 0.6s ease-out forwards;
        }

        @keyframes popUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            50% { transform: translateY(-12px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-20px) scale(1); }
        }

        .fx-card {
            flex: 2;
            justify-content: space-between;
        }

        .fx-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
            margin-top: 4px;
        }

        .fx-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 4px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .fx-item.active {
            background: rgba(59, 130, 246, 0.25);
            border-color: var(--accent-blue);
        }

        .fx-name { font-size: 0.8rem; color: var(--text-secondary); font-weight: 600; }
        .fx-rate { font-size: 0.9rem; font-weight: bold; color: #ffffff; }

        .fx-converter {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 6px;
            padding: 4px 8px;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .fx-converter input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85rem;
            width: 70px;
            text-align: right;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }

        .swap-btn {
            background: var(--accent-blue);
            border: none;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-sub { font-size: 0.75rem; font-weight: normal; color: var(--text-secondary); }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="column">
            <div class="card time-card">
                <div id="clock">00:00:00</div>
                <div id="date">加載中...</div>
                <div id="lunar-info">農曆計算中...</div>
                <div><span id="countdown">假期倒數：計算中...</span></div>
            </div>

            <div class="card hsi-card">
                <div class="card-title">
                    <span>香港恆生指數 (HSI)</span>
                    <span id="hsi-update-time" class="title-sub">--</span>
                </div>
                <div class="hsi-body">
                    <div id="hsi-price">--</div>
                    <div id="hsi-change">--</div>
                </div>
            </div>

            <div class="card weather-card">
                <div class="card-title">香港即時天氣</div>
                <div id="weather-info" style="font-size: 1rem; margin-top: 2px; line-height: 1.2;">載入中...</div>
                <div id="weather-alerts"></div>
            </div>
        </div>

        <div class="column">
            <div class="card work-cat-card">
                <div>
                    <div class="progress-header">
                        <span onclick="setWorkHours()" style="cursor: pointer; text-decoration: underline;">放工進度 ⚙️</span>
                        <span id="work-percent" style="font-weight: bold; color: #10b981;">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="work-bar"></div>
                    </div>
                </div>

                <div class="cat-box" onclick="interactWithBobo()">
                    <div class="cat-avatar-container">
                        <img id="bobo-img" src="bobo_playful.jpeg" alt="寶寶" class="bobo-photo" onerror="this.onerror=null; this.src='https://placehold.co/100x100/f472b6/ffffff?text=Bobo';">
                        <span id="bobo-heart" class="heart-pop">❤️</span>
                    </div>
                    <div class="cat-speech-container">
                        <div class="cat-name">寶寶提醒你：</div>
                        <div class="cat-speech" id="cat-text">載入中...</div>
                    </div>
                </div>
            </div>

            <div class="card fx-card">
                <div class="card-title">
                    <span>即時外幣牌價 (兌 HKD)</span>
                    <span id="fx-update-time" class="title-sub">--</span>
                </div>

                <div class="fx-grid">
                    <div class="fx-item active" id="item-USD" onclick="selectCurrency('USD')"><span class="fx-name">USD 美元</span><span class="fx-rate" id="rate-USD">7.800</span></div>
                    <div class="fx-item" id="item-EUR" onclick="selectCurrency('EUR')"><span class="fx-name">EUR 歐元</span><span class="fx-rate" id="rate-EUR">8.450</span></div>
                    <div class="fx-item" id="item-GBP" onclick="selectCurrency('GBP')"><span class="fx-name">GBP 英鎊</span><span class="fx-rate" id="rate-GBP">9.900</span></div>
                    <div class="fx-item" id="item-CAD" onclick="selectCurrency('CAD')"><span class="fx-name">CAD 加元</span><span class="fx-rate" id="rate-CAD">5.750</span></div>
                    <div class="fx-item" id="item-CHF" onclick="selectCurrency('CHF')"><span class="fx-name">CHF 瑞郎</span><span class="fx-rate" id="rate-CHF">8.850</span></div>
                    <div class="fx-item" id="item-AUD" onclick="selectCurrency('AUD')"><span class="fx-name">AUD 澳元</span><span class="fx-rate" id="rate-AUD">
