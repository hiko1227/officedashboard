<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>桌面資訊儀表板 (橫向極簡版)</title>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: rgba(28, 37, 65, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-warn: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 12px;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            height: 100%;
            max-width: 1000px;
            max-height: 600px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 左側：時間與農曆/節氣 */
        .time-card {
            flex: 1.5;
            text-align: center;
            background: linear-gradient(135deg, rgba(28, 37, 65, 0.9), rgba(11, 19, 43, 0.9));
        }

        #clock {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 1.1;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        #date {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        #lunar-info {
            font-size: 0.9rem;
            color: #60a5fa;
            font-weight: 600;
            margin-top: 2px;
        }

        #countdown {
            margin-top: 6px;
            font-size: 0.8rem;
            color: var(--accent-warn);
            background: rgba(245, 158, 11, 0.1);
            padding: 3px 8px;
            border-radius: 6px;
            display: inline-block;
        }

        /* 天氣卡片 (加大字體) */
        .weather-card {
            flex: 1.2;
        }

        .weather-alert {
            display: inline-block;
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-top: 4px;
            font-weight: bold;
        }

        /* 恆指卡片 */
        .hsi-card {
            flex: 1;
        }

        .hsi-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            padding: 8px 12px;
            border-radius: 10px;
            margin-top: 6px;
        }

        #hsi-price {
            font-size: 1.5rem;
            font-weight: bold;
        }

        #hsi-change {
            font-size: 0.95rem;
            font-weight: bold;
        }

        .update-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: right;
            margin-top: 4px;
        }

        /* 新聞即時頭條 */
        .news-card {
            flex: 1.7;
            justify-content: flex-start;
            overflow: hidden;
        }

        #news-list {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            max-height: 120px;
        }

        .news-item {
            font-size: 0.88rem;
            color: #e2e8f0;
            line-height: 1.3;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- 左欄：時間、農曆/節氣、天氣 -->
        <div class="column">
            <div class="card time-card">
                <div id="clock">00:00:00</div>
                <div id="date">加載中...</div>
                <div id="lunar-info">農曆計算中...</div>
                <div><span id="countdown">假期倒數：計算中...</span></div>
            </div>

            <div class="card weather-card">
                <div class="card-title">香港即時天氣</div>
                <!-- 加大天氣字體 -->
                <div id="weather-info" style="font-size: 1.15rem; margin-top: 6px; line-height: 1.4;">載入天氣數據中...</div>
                <div id="weather-alerts"></div>
            </div>
        </div>

        <!-- 右欄：恆指、即時焦點新聞 -->
        <div class="column">
            <div class="card hsi-card">
                <div class="card-title">香港恆生指數 (HSI)</div>
                <div class="hsi-body">
                    <div id="hsi-price">載入中...</div>
                    <div id="hsi-change">--</div>
                </div>
                <div id="hsi-update-time" class="update-time">更新時間: --</div>
            </div>

            <div class="card news-card">
                <div class="card-title">
                    <span>即時新聞焦點 (RTHK)</span>
                    <span id="news-time" style="font-size: 0.75rem; font-weight: normal;">更新中...</span>
                </div>
                <div id="news-list">正在取得新聞...</div>
            </div>
        </div>
    </div>

    <script>
        // 1. 時鐘與西曆日期
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('zh-HK', { hour12: false });
            
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('date').textContent = now.toLocaleDateString('zh-HK', options);
        }

        // 2. 農曆與節氣轉換計算 (簡化高性能版)
        function updateLunarDate() {
            try {
                const now = new Date();
                const lunarText = new Intl.DateTimeFormat('zh-TN-u-ca-chinese', {
                    day: 'numeric',
                    month: 'long'
                }).format(now);

                // 24 節氣估算（依公曆月份與日期對應）
                const month = now.getMonth() + 1;
                const day = now.getDate();
                let solarTerm = "";

                const terms = {
                    1: { 5: "小寒", 20: "大寒" }, 2: { 4: "立春", 19: "雨水" },
                    3: { 5: "驚蟄", 20: "春分" }, 4: { 4: "清明", 19: "穀雨" },
                    5: { 5: "立夏", 20: "小滿" }, 6: { 5: "芒種", 21: "夏至" },
                    7: { 7: "小暑", 22: "大暑" }, 8: { 7: "立秋", 23: "處暑" },
                    9: { 7: "白露", 22: "秋分" }, 10: { 8: "寒露", 23: "霜降" },
                    11: { 7: "立冬", 22: "小雪" }, 12: { 7: "大雪", 21: "冬至" }
                };

                if (terms[month]) {
                    for (let d in terms[month]) {
                        if (Math.abs(day - parseInt(d)) <= 1) {
                            solarTerm = ` · 【${terms[month][d]}】`;
                            break;
                        }
                    }
                }

                document.getElementById('lunar-info').textContent = `農曆 ${lunarText}${solarTerm}`;
            } catch (e) {
                document.getElementById('lunar-info').textContent = '';
            }
        }

        // 3. 香港公眾假期動態計算
        function updateHolidayCountdown() {
            const now = new Date();
            const year = now.getFullYear();

            // 香港主要公眾假期列表 (月由 0 開始)
            const holidays = [
                { name: "中秋節後翌日", date: new Date(year, 8, 26) }, // 9月26日
                { name: "國慶日", date: new Date(year, 9, 1) },       // 10月1日
                { name: "重陽節", date: new Date(year, 9, 19) },      // 10月19日
                { name: "聖誕節", date: new Date(year, 11, 25) },     // 12月25日
                { name: "元旦", date: new Date(year + 1, 0, 1) }       // 明年1月1日
            ];

            let nextHoliday = holidays.find(h => h.date >= now);
            if (!nextHoliday) {
                nextHoliday = { name: "元旦", date: new Date(year + 1, 0, 1) };
            }

            const diffTime = nextHoliday.date - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            document.getElementById('countdown').textContent = `距離 ${nextHoliday.name}：仲有 ${diffDays} 天`;
        }

        // 4. 天文台天氣 (加大字體)
        async function fetchWeather() {
            const weatherEl = document.getElementById('weather-info');
            const alertsEl = document.getElementById('weather-alerts');

            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();
                
                const temp = data.temperature.data[0].value;
                const humidity = data.humidity.data[0].value;
                const rainfall = data.rainfall.data[0]?.max || 0;

                // 加大字體及視覺強調
                weatherEl.innerHTML = `🌡️ <b>${temp}°C</b> &nbsp;|&nbsp; 💧 <b>${humidity}%</b><br><span style="font-size:0.85rem; color:#94a3b8;">🌧️ 今日降雨量: ${rainfall} mm</span>`;

                // 警告摘要
                const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const warnData = await warnRes.json();
                
                let alertHtml = '';
                if (warnData && Object.keys(warnData).length > 0) {
                    for (const key in warnData) {
                        const warn = warnData[key];
                        if (warn.name) {
                            alertHtml += `<span class="weather-alert">⚠️ ${warn.name}</span> `;
                        }
                    }
                }
                alertsEl.innerHTML = alertHtml || '<span style="font-size:0.75rem; color:#10b981; margin-top:4px; display:block;">現時無特別天氣警告</span>';

            } catch (err) {
                weatherEl.textContent = '天氣數據讀取失敗';
            }
        }

        // 5. 恆生指數
        async function fetchHSI() {
            const priceEl = document.getElementById('hsi-price');
            const changeEl = document.getElementById('hsi-change');
            const timeEl = document.getElementById('hsi-update-time');

            try {
                const res = await fetch('https://push2.eastmoney.com/api/qt/stock/get?secid=100.HSI&fields=f43,f169,f170');
                const responseData = await res.json();
                const data = responseData.data;

                if (!data) throw new Error('無數據');
                
                const currentPrice = data.f43 / 100;
                const change = data.f169 / 100;
                const changePercent = data.f170 / 100;
                
                const isPositive = change >= 0;
                const sign = isPositive ? '+' : '';
                const color = isPositive ? 'var(--accent-green)' : 'var(--accent-red)';

                priceEl.textContent = currentPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                priceEl.style.color = '#ffffff';

                changeEl.textContent = `${sign}${change.toFixed(2)} (${sign}${changePercent.toFixed(2)}%)`;
                changeEl.style.color = color;

                const now = new Date();
                timeEl.textContent = `更新時間: ${now.toLocaleTimeString('zh-HK', { hour12: false })}`;
            } catch (err) {
                priceEl.textContent = '數據擷取中...';
            }
        }

        // 6. 即時新聞 (取代備忘錄)
        async function fetchNews() {
            const newsListEl = document.getElementById('news-list');
            const newsTimeEl = document.getElementById('news-time');

            try {
                // 使用跨網域代理抓取 RTHK 即時新聞 RSS
                const res = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://rthk.hk/rthk/news/rss/c_expressnews_clocal.xml'));
                const data = await res.json();
                
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(data.contents, "text/xml");
                const items = xmlDoc.querySelectorAll("item");

                let newsHtml = '';
                for (let i = 0; i < Math.min(items.length, 4); i++) {
                    const title = items[i].querySelector("title")?.textContent || "";
                    newsHtml += `<div class="news-item">• ${title}</div>`;
                }

                newsListEl.innerHTML = newsHtml || '暫無即時新聞';
                const now = new Date();
                newsTimeEl.textContent = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')} 更新`;
            } catch (err) {
                newsListEl.innerHTML = '<div class="news-item" style="color:#94a3b8;">新聞數據加載中...</div>';
            }
        }

        // 初始化與定時更新
        updateTime();
        updateLunarDate();
        updateHolidayCountdown();
        fetchWeather();
        fetchHSI();
        fetchNews();

        setInterval(updateTime, 1000);
        setInterval(fetchWeather, 600000); // 10分鐘更新天氣
        setInterval(fetchHSI, 60000);      // 1分鐘更新恆指
        setInterval(fetchNews, 300000);    // 5分鐘更新新聞
    </script>
</body>
</html>
