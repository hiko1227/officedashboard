<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公司桌面資訊儀表板 - 寶寶陪伴版</title>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: rgba(28, 37, 65, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-warn: #f59e0b;
            --accent-pink: #f472b6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 5px;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 8px;
            width: 100%;
            height: 100%;
            max-width: 1050px;
            max-height: 100vh;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 100%;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .time-card {
            flex: 1.1;
            text-align: center;
            background: linear-gradient(135deg, rgba(28, 37, 65, 0.9), rgba(11, 19, 43, 0.9));
        }

        #clock {
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 1.1;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        #date {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        #lunar-info {
            font-size: 0.85rem;
            color: #60a5fa;
            font-weight: 600;
            margin-top: 1px;
        }

        #countdown {
            margin-top: 4px;
            font-size: 0.8rem;
            color: var(--accent-warn);
            background: rgba(245, 158, 11, 0.15);
            padding: 2px 6px;
            border-radius: 6px;
            display: inline-block;
        }

        .weather-card {
            flex: 1;
        }

        .weather-alert {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-top: 4px;
            font-weight: 800;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        @keyframes alertPulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.04); opacity: 0.85; }
            100% { transform: scale(1); opacity: 1; }
        }

        .alert-yellow-rain {
            background: #facc15;
            color: #000000;
            border: 1px solid #fde047;
            animation: alertPulse 2s infinite ease-in-out;
        }

        .alert-red-rain {
            background: #ef4444;
            color: #ffffff;
            border: 1px solid #fca5a5;
            animation: alertPulse 1.2s infinite ease-in-out;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
        }

        .alert-black-rain {
            background: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            animation: alertPulse 1s infinite ease-in-out;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
        }

        .alert-typhoon {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: #ffffff;
            border: 1px solid #c084fc;
            animation: alertPulse 1.2s infinite ease-in-out;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.7);
        }

        .alert-default {
            background: rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.5);
        }

        .hsi-card { flex: 1; }

        .hsi-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 10px;
            border-radius: 8px;
            margin-top: 4px;
        }

        #hsi-price { font-size: 1.35rem; font-weight: bold; }
        #hsi-change { font-size: 0.9rem; font-weight: bold; }

        .work-cat-card {
            flex: 1.45;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.8));
            justify-content: space-between;
            padding: 8px 12px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            margin: 4px 0;
            position: relative;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #3b82f6, #10b981);
            height: 100%;
            width: 0
